<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Priceline & Expedia Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Drivo brand palette (Color Palette, brand book p.02) */
:root {
  color-scheme: light;
  --navy: #091365;       /* Navy      · Pantone 662 C  */
  --blue: #0d1ca4;       /* Baby Blue · Pantone 072 C  */
  --yellow: #f3bb04;     /* Yellow    · Pantone 7406 C */
  --white: #fbfbfb;      /* White */
  --black: #121212;      /* Black */

  --page: #f3f4fa;
  --surface: #ffffff;
  --ink: var(--black);
  --ink-2: #3c4066;
  --muted: #7c809a;
  --grid: #e8e9f1;
  --baseline: #c9cbdc;
  --ring: rgba(9, 19, 101, 0.09);
  --pos: #2f43d6;         /* positive 4–5★ · brand blue, lifted for the bars */
  --neu: #d9dcf0;         /* neutral 3★ · pale blue-grey */
  --neg: #f28b7d;         /* negative 1–2★ · coral */
  --accent: var(--blue);
  --wash: rgba(13, 28, 164, 0.07);
  --delta-good: var(--blue);
  --delta-bad: #d9534f;
  --shadow: 0 8px 24px rgba(9, 19, 101, 0.08);
  --card-shadow: 0 1px 2px rgba(9, 19, 101, 0.06), 0 8px 24px rgba(9, 19, 101, 0.05);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 15px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  min-width: 0;
  overflow-x: hidden;
}
/* Fluid frame: full viewport width at every size (no max-width).
   The side gutters respect notches / rounded corners (safe-area insets). */
.wrap {
  width: 100%; margin: 0;
  padding: clamp(12px, 2.5vw, 28px)
           max(clamp(16px, 3vw, 32px), env(safe-area-inset-right))
           calc(48px + env(safe-area-inset-bottom))
           max(clamp(16px, 3vw, 32px), env(safe-area-inset-left));
}

/* ---------- hero header (Blue Gradient #091365 → #0D1CA4) ---------- */
.hero {
  background: linear-gradient(120deg, var(--navy) 0%, var(--blue) 100%);
  color: #fff; border-radius: clamp(12px, 2vw, 20px);
  padding: clamp(18px, 3vw, 28px) clamp(18px, 3.5vw, 32px) clamp(16px, 3vw, 24px);
  margin-bottom: clamp(12px, 2vw, 18px);
  position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -60px; top: -80px; width: 260px; height: 260px;
  border-radius: 50%; background: rgba(255,255,255,0.06); pointer-events: none;
}
.eyebrow {
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--yellow); font-weight: 700; margin-bottom: 6px;
}
h1 { font-size: clamp(20px, 1.4vw + 14px, 28px); font-weight: 700; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
.sub { color: rgba(255,255,255,0.78); font-size: clamp(13px, 0.3vw + 12px, 14px); margin: 0; }
.stamp { display: inline-flex; align-items: center; gap: 6px; color: #fff; }
.stamp .pulse {
  width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); flex: none;
  animation: pulse 2.4s ease-in-out infinite;
}
.stamp.stale .pulse { background: rgba(255,255,255,0.55); animation: none; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .stamp .pulse { animation: none; } }

.banner {
  background: rgba(255,255,255,0.12); border: 1px solid var(--yellow); border-radius: 8px;
  padding: 10px 14px; font-size: 13.5px; color: #fff; margin: 14px 0 0;
  display: none;
}
.banner.show { display: block; }

/* ---------- controls ---------- */
.controls {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  margin: 0 0 16px;
}
.controls > * { min-width: 0; }
.seglab {
  font-size: 12px; font-weight: 600; color: var(--muted); align-self: center;
  padding: 0 4px 0 9px; white-space: nowrap;
}
.seg {
  display: inline-flex; background: var(--surface); border: 1px solid var(--ring);
  border-radius: 8px; padding: 3px; gap: 2px;
}
.seg button {
  border: 0; background: transparent; color: var(--ink-2); font: inherit;
  font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 6px;
  cursor: pointer;
}
.seg button:hover { background: var(--wash); }
.seg button.on { background: var(--navy); color: #fff; }
.seg button:focus-visible, select:focus-visible, input:focus-visible, .toggle:focus-visible,
.ddbtn:focus-visible, .prow:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
select, input[type="search"], input[type="date"] {
  background: var(--surface); color: var(--ink); border: 1px solid var(--ring);
  border-radius: 8px; font: inherit; font-size: 13px; padding: 7px 10px;
}
input[type="search"] { width: 160px; flex: 0 1 200px; min-width: 120px; }
label.chk {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
  color: var(--ink-2); cursor: pointer; user-select: none;
}
label.chk input { accent-color: var(--accent); }
.toggle {
  background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--ring); border-radius: 8px; font: inherit;
  font-size: 13px; font-weight: 600; padding: 7px 12px; cursor: pointer;
}
.toggle:hover { background: var(--wash); }
.spacer { margin-left: auto; display: flex; gap: 8px; }

/* dropdown with popover (date range + multi-select locations) */
.dd { position: relative; }
.ddbtn {
  display: inline-flex; align-items: center; gap: 8px; max-width: min(320px, 100%);
  background: var(--surface); color: var(--ink); border: 1px solid var(--ring);
  border-radius: 8px; font: inherit; font-size: 13px; padding: 6px 10px 6px 12px; cursor: pointer;
  text-align: left;
}
.ddbtn:hover { background: var(--wash); }
.ddbtn.active { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue) inset; }
.ddbtn .ddlab { color: var(--muted); font-weight: 500; font-size: 12px; }
.ddbtn .ddval { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ddbtn .ddn {
  background: var(--navy); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px;
  padding: 0 7px; line-height: 18px; display: none;
}
.ddbtn .ddn.show { display: inline-block; }
.ddbtn svg { width: 12px; height: 12px; flex: none; color: var(--muted); }
.pop {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: min(250px, calc(100vw - 32px));
  max-width: calc(100vw - 32px);
  background: var(--surface); border: 1px solid var(--ring); border-radius: 12px;
  box-shadow: var(--shadow); padding: 6px; font-size: 13.5px;
}
.pop[hidden] { display: none; }
.pop.right { left: auto; right: 0; }
#datePop { min-width: min(330px, calc(100vw - 32px)); }
.pop-title {
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  font-weight: 700; padding: 8px 10px 4px;
}
.pop-list { display: flex; flex-direction: column; max-height: min(320px, 45vh); overflow-y: auto; }
.prow {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 13.5px;
  padding: 7px 10px; border-radius: 8px; cursor: pointer; user-select: none;
}
.prow:hover { background: var(--wash); }
.prow .ck {
  width: 16px; height: 16px; flex: none; border-radius: 4px; border: 1.5px solid var(--baseline);
  display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700;
}
.prow .ck.radio { border-radius: 50%; }
.prow.on .ck { background: var(--blue); border-color: var(--blue); }
.prow.on .ck::after { content: "✓"; line-height: 1; }
.prow.on { font-weight: 600; }
.prow .cnt { margin-left: auto; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.prow .hint { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 400; white-space: nowrap; }
.pop-foot { border-top: 1px solid var(--grid); margin-top: 6px; padding: 10px 10px 6px; }
.range { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.range label { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.range input[type="date"] { min-width: 0; width: 100%; }
.range label { flex: 1 1 130px; }
.range .sep { color: var(--muted); padding-top: 16px; }
.pop-note { color: var(--muted); font-size: 12px; margin-top: 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; color: var(--blue); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 0; }
.linkbtn:hover { text-decoration: underline; }
.pop-actions { display: flex; gap: 8px; justify-content: flex-end; padding: 6px 10px 4px; border-top: 1px solid var(--grid); margin-top: 6px; }

/* ---------- tiles ---------- */
/* Flex, not grid, so a tile that wraps alone stretches across its row instead of sitting orphaned. */
.tiles { display: flex; flex-wrap: wrap; gap: clamp(8px, 1.2vw, 12px); margin-bottom: 16px; }
.tiles .tile { flex: 1 1 170px; }
.tile {
  background: var(--surface); border: 0; box-shadow: var(--card-shadow); border-radius: 12px;
  padding: clamp(11px, 1.2vw, 14px) clamp(12px, 1.4vw, 16px); min-width: 0;
}
.tile .k {
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 6px;
}
.tile .k .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.tile .v { font-size: clamp(22px, 1.2vw + 16px, 30px); font-weight: 700; margin-top: 2px; letter-spacing: -0.01em; color: var(--navy); font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }

/* ---------- card + chart ---------- */
.card {
  background: var(--surface); border: 0; box-shadow: var(--card-shadow); border-radius: 14px;
  padding: clamp(12px, 1.6vw, 18px) clamp(12px, 1.8vw, 20px);
  min-width: 0;
}
.card + .card { margin-top: 16px; }
.card-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline; margin-bottom: 14px; }
.card-head h2 { font-size: 15px; font-weight: 700; margin: 0; color: var(--navy); }
.card-head .n { color: var(--muted); font-size: 13px; }
.legend { display: flex; gap: 14px; margin-left: auto; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }

.rows { display: flex; flex-direction: column; transition: opacity 0.2s; }
.rows[hidden] { display: none; }
.loading .rows, .loading .tiles { opacity: 0.55; }
.grp-head {
  display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline;
  margin: 16px 6px 6px; padding-top: 12px; border-top: 1px solid var(--grid);
}
.grp-head:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.grp-name {
  font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; color: var(--navy);
  background: var(--wash); border-radius: 6px; padding: 1px 8px;
}
.grp-sum { font-size: 12.5px; color: var(--muted); }
table.data tr.grp td {
  color: var(--navy); font-weight: 700; text-align: left;
  padding-top: 16px; border-bottom: 1px solid var(--baseline);
}
/* Name column scales with the viewport (≈18% of the row, 90–220px); the bar
   takes whatever is left; the two number columns hug their content. */
.row {
  display: grid; grid-template-columns: clamp(90px, 18%, 220px) minmax(0, 1fr) auto auto;
  gap: clamp(6px, 1.2vw, 12px);
  align-items: center; padding: 7px 6px; border-radius: 8px;
}
.row:hover { background: var(--wash); }
.row .name {
  font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; text-align: right; color: var(--ink);
}
.row .name.unassigned { color: var(--muted); font-style: italic; }
.row .total { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; min-width: 3.2ch; }
.net { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.row .net { min-width: 4ch; }
.net.up { color: var(--delta-good); }
.net.down { color: var(--delta-bad); }
.net.flat { color: var(--muted); }
.bar { display: flex; height: 14px; align-items: stretch; }
.segp { display: flex; min-width: 0; }
.seg-fill {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: #fff; overflow: hidden;
  white-space: nowrap;
}
.segp + .segp { margin-left: 2px; }
.segp:first-child .seg-fill { border-radius: 7px 0 0 7px; }
.segp:last-child .seg-fill { border-radius: 0 7px 7px 0; }
.segp:only-child .seg-fill { border-radius: 7px; }
.seg-fill.neu-fill { color: var(--navy); }
.seg-fill.neg-fill { color: #5a1a14; }
.segp:hover .seg-fill { filter: brightness(1.15); }
.empty { color: var(--muted); font-size: 13px; padding: 12px 6px; }

#tooltip {
  position: fixed; pointer-events: none; z-index: 10; display: none;
  background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
  box-shadow: var(--shadow); padding: 10px 12px; font-size: 12.5px;
  min-width: min(200px, calc(100vw - 16px)); max-width: calc(100vw - 16px);
}
#tooltip .tt-name { font-weight: 700; margin-bottom: 2px; color: var(--navy); }
#tooltip .tt-scope { color: var(--muted); font-size: 11.5px; margin-bottom: 6px; }
#tooltip table { border-collapse: collapse; width: 100%; }
#tooltip td { padding: 1.5px 0; color: var(--ink-2); }
#tooltip td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); padding-left: 12px; font-weight: 600; }
#tooltip .sw { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

.tablewrap { overflow-x: auto; }
table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
table.data th, table.data td { padding: 7px 10px; text-align: right; font-variant-numeric: tabular-nums; }
table.data th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--baseline); white-space: nowrap; }
table.data td { border-bottom: 1px solid var(--grid); color: var(--ink-2); }
table.data th:first-child, table.data td:first-child {
  text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1;
}
table.data td:first-child { color: var(--ink); font-weight: 600; }
table.data td.posc { color: var(--pos); font-weight: 600; }
table.data td.negc { color: var(--delta-bad); font-weight: 600; }
.foot { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
/* ---------- breakpoints ---------- */
/* Tablets / narrow laptops: let the controls fill the row instead of ragged wrapping. */
@media (max-width: 900px) {
  .dd { flex: 1 1 220px; }
  .ddbtn { width: 100%; max-width: none; }
  .ddbtn .ddval { flex: 1; }
  select { flex: 1 1 150px; }
  input[type="search"] { flex: 1 1 150px; }
  .spacer { margin-left: 0; flex: 1 1 100%; }
  .spacer .toggle { flex: 1; }
}
/* Phones */
@media (max-width: 640px) {
  .hero::after { display: none; }
  .controls { gap: 8px; }
  .dd { flex-basis: 100%; }
  .seg { flex: 1 1 auto; }
  .seg button { flex: 1; padding: 6px 8px; }
  label.chk { flex: 1 1 auto; }
  .row { grid-template-columns: minmax(78px, 30%) minmax(0, 1fr) auto auto; gap: 8px; padding: 6px 2px; }
  /* Let names wrap to two lines instead of truncating to a few letters. */
  .row .name {
    font-size: 12px; line-height: 1.2; white-space: normal; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .tiles .tile { flex-basis: 140px; }
  .legend { margin-left: 0; gap: 10px; }
  .card-head { margin-bottom: 10px; }
  .grp-head { margin: 12px 2px 4px; }
  .foot { font-size: 12px; }
  /* Popovers become bottom sheets so they never overflow the viewport. */
  .pop, .pop.right {
    position: fixed; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right));
    top: auto; bottom: max(12px, env(safe-area-inset-bottom));
    max-width: none; max-height: calc(100vh - 24px); overflow-y: auto;
  }
  #tooltip { display: none !important; }
}
/* Small phones */
@media (max-width: 380px) {
  .tile .v { font-size: 21px; }
  .tile .s { font-size: 11.5px; }
  .row { grid-template-columns: minmax(64px, 28%) minmax(0, 1fr) auto auto; }
  .row .name { font-size: 12px; }
  .seg button { font-size: 12px; padding: 6px 6px; }
}
/* Touch devices: taller tap targets. */
@media (hover: none) and (pointer: coarse) {
  .seg button, .toggle, .ddbtn, select, input[type="search"], input[type="date"] { min-height: 38px; }
  .prow { padding: 9px 10px; }
}
/* Very wide monitors: widen the name column so long names stop truncating. */
@media (min-width: 1500px) {
  .row { grid-template-columns: 240px minmax(0, 1fr) auto auto; }
  body { font-size: 16px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">Drivo · Priceline &amp; Expedia</div>
    <h1>Priceline &amp; Expedia Dashboard</h1>
    <p class="sub"><span id="subline">Loading the latest reviews from Google Sheets…</span>
      <span class="stamp" id="stamp" hidden><span class="pulse"></span><span id="stampText"></span></span>
    </p>
    <div class="banner" id="banner"></div>
  </header>

  <div class="controls">
    <div class="dd" id="dateDD">
      <button class="ddbtn" id="dateBtn" aria-haspopup="true" aria-expanded="false">
        <span class="ddlab">Dates</span><span class="ddval" id="dateVal">All time</span>
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
      </button>
      <div class="pop" id="datePop" hidden>
        <div class="pop-title">Quick ranges</div>
        <div class="pop-list" id="datePresets"></div>
        <div class="pop-foot">
          <div class="pop-title" style="padding-left:0">Custom range</div>
          <div class="range">
            <label>From <input type="date" id="dFrom"></label>
            <span class="sep">–</span>
            <label>To <input type="date" id="dTo"></label>
          </div>
          <div class="pop-note"><span id="dataSpan"></span><button class="linkbtn" id="dClear">Clear dates</button></div>
        </div>
      </div>
    </div>

    <div class="dd" id="locDD">
      <button class="ddbtn" id="locBtn" aria-haspopup="true" aria-expanded="false">
        <span class="ddlab">Locations</span><span class="ddval" id="locVal">All</span><span class="ddn" id="locN"></span>
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
      </button>
      <div class="pop" id="locPop" hidden>
        <div class="pop-title">Pick one or several</div>
        <div class="pop-list" id="locList"></div>
        <div class="pop-actions"><button class="linkbtn" id="locClear">Select all</button></div>
      </div>
    </div>

    <div class="seg" role="group" aria-label="Source" id="srcSeg">
      <button data-src="both" class="on">Both</button>
      <button data-src="e">Expedia</button>
      <button data-src="p">Priceline</button>
    </div>
    <div class="seg" role="group" aria-label="Duplicates" id="dupSeg" title="Reviews marked “Duplicate? = Yes” in the sheet">
      <span class="seglab">Duplicates</span>
      <button data-dup="hide" class="on">Hide</button>
      <button data-dup="show">Show</button>
    </div>
    <div class="seg" role="group" aria-label="Bar mode" id="modeSeg">
      <button data-mode="count" class="on">Counts</button>
      <button data-mode="share">Share %</button>
    </div>
    <select id="sortSel" aria-label="Sort agents">
      <option value="total">Most reviews</option>
      <option value="net">Best net (pos − neg)</option>
      <option value="neg">Most negative</option>
      <option value="pos">Most positive</option>
      <option value="pctpos">Highest % positive</option>
      <option value="pctneg">Highest % negative</option>
      <option value="name">Name A–Z</option>
    </select>
    <input type="search" id="search" placeholder="Find an agent…" aria-label="Find an agent">
    <label class="chk"><input type="checkbox" id="unassigned"> Include unassigned</label>
    <div class="spacer">
      <button class="toggle" id="refreshBtn" title="Re-pull the sheet now">↻ Refresh</button>
      <button class="toggle" id="viewToggle">Table view</button>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="card">
    <div class="card-head">
      <h2 id="cardTitle">Reviews by agent</h2>
      <span class="n" id="cardCount"></span>
      <div class="legend">
        <span><i style="background:var(--pos)"></i>Positive 4–5★</span>
        <span><i style="background:var(--neu)"></i>Neutral 3★</span>
        <span><i style="background:var(--neg)"></i>Negative 1–2★</span>

const fmt = n => n.toLocaleString("en-US");

/* ---------- dates ---------- */

const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const shift = (d, days) => { const x = new Date(d); x.setDate(x.getDate() + days); return x; };
function fmtDate(k, withYear = true) {
  const [y, m, d] = k.split("-").map(Number);
  return MONTH_ABBR[m - 1] + " " + d + (withYear ? ", " + y : "");
}
function fmtRange(from, to) {
  if (!from && !to) return "All time";
  if (from && !to) return "From " + fmtDate(from);
  if (!from && to) return "Until " + fmtDate(to);
  if (from === to) return fmtDate(from);
  const sameYear = from.slice(0, 4) === to.slice(0, 4);
  return fmtDate(from, !sameYear) + " – " + fmtDate(to);
}
const PRESETS = [
  { id: "all",  label: "All time",       range: () => [null, null] },
  { id: "7d",   label: "Last 7 days",    range: () => { const t = today(); return [iso(shift(t, -6)), iso(t)]; } },
  { id: "30d",  label: "Last 30 days",   range: () => { const t = today(); return [iso(shift(t, -29)), iso(t)]; } },
  { id: "90d",  label: "Last 90 days",   range: () => { const t = today(); return [iso(shift(t, -89)), iso(t)]; } },
  { id: "tm",   label: "This month",     range: () => { const t = today(); return [iso(new Date(t.getFullYear(), t.getMonth(), 1)), iso(t)]; } },
  { id: "lm",   label: "Last month",     range: () => { const t = today(); return [iso(new Date(t.getFullYear(), t.getMonth() - 1, 1)), iso(new Date(t.getFullYear(), t.getMonth(), 0))]; } },
  { id: "ytd",  label: "Year to date",   range: () => { const t = today(); return [iso(new Date(t.getFullYear(), 0, 1)), iso(t)]; } },
  { id: "12m",  label: "Last 12 months", range: () => { const t = today(); return [iso(new Date(t.getFullYear() - 1, t.getMonth(), t.getDate() + 1)), iso(t)]; } },
];
function inRange(k) {
  if (!state.from && !state.to) return true;
  if (k === UNKNOWN_DATE) return false;
  return (!state.from || k >= state.from) && (!state.to || k <= state.to);
}
function dateLabel() {
  const p = PRESETS.find(p => p.id === state.preset);
  return p && p.id !== "all" ? p.label : fmtRange(state.from, state.to);
}
function applyPreset(id) {
  const p = PRESETS.find(p => p.id === id) || PRESETS[0];
  state.preset = p.id;
  [state.from, state.to] = p.range();
  syncDateUI();
  render();
}
function applyCustom() {
  const f = document.getElementById("dFrom").value || null;
  const t = document.getElementById("dTo").value || null;
  state.from = f; state.to = t;
  if (f && t && f > t) { state.from = t; state.to = f; } // tolerate swapped bounds
  state.preset = (!f && !t) ? "all" : "custom";
  syncDateUI();

}
function syncDateUI() {
  document.getElementById("dateVal").textContent = dateLabel();
  document.getElementById("dFrom").value = state.from || "";
  document.getElementById("dTo").value = state.to || "";
  document.querySelectorAll("#datePresets .prow").forEach(b => b.classList.toggle("on", b.dataset.preset === state.preset));
  document.getElementById("dateBtn").classList.toggle("active", state.preset !== "all");
}
function buildDatePresets() {
  document.getElementById("datePresets").innerHTML = PRESETS.map(p => {
    const [f, t] = p.range();
    const hint = p.id === "all" ? "" : `<span class="hint">${esc(fmtRange(f, t))}</span>`;
    return `<button class="prow" data-preset="${p.id}"><span class="ck radio"></span>${p.label}${hint}</button>`;
  }).join("");
}

async function loadData() {
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true; btn.textContent = "↻ Refreshing…";
  document.body.classList.add("loading");
  try {
    const res = await fetch(DATA_URL + "&_cb=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    if (!json.rows || !json.rows.length) throw new Error("empty dataset");
    // Tolerate legacy month-only keys ("YYYY-MM") by pinning them to the 1st,
    // and 5-tuples without the duplicate flag (treated as not duplicates).
    ROWS = json.rows.map(r => {
      const d = r[4] && r[4].length === 7 ? (r[4] === "0000-00" ? UNKNOWN_DATE : r[4] + "-01") : r[4];
      return [r[0], r[1], r[2], r[3], d, r[5] ? 1 : 0];
    });
    lastFetched = new Date(json.fetchedAt || Date.now());

    document.getElementById("stamp").hidden = false;
    document.getElementById("stamp").classList.remove("stale");

      : "Couldn't reach Google Sheets (" + err.message +
        "). Showing " + (lastFetched ? "the last loaded data." : "a saved snapshot from " + SNAPSHOT_DATE + ".") +
        " It will retry automatically.";
    b.classList.add("show");
  }
  populateFilters();
  btn.disabled = false; btn.textContent = "↻ Refresh";
  document.body.classList.remove("loading");
  render();
}

/* ---------- filters ---------- */

let LOC_COUNTS = {};
function populateFilters() {
  DUP_N = 0;
  ROWS.forEach(r => { if (r[5]) DUP_N++; });
  VIS = state.dups === "show" ? ROWS : ROWS.filter(r => !r[5]);
  LOC_COUNTS = {};
  dataMin = null; dataMax = null;
  VIS.forEach(r => {
    LOC_COUNTS[r[3]] = (LOC_COUNTS[r[3]] || 0) + 1;
    if (r[4] !== UNKNOWN_DATE) {
      if (!dataMin || r[4] < dataMin) dataMin = r[4];
      if (!dataMax || r[4] > dataMax) dataMax = r[4];
    }
  });
  // Drop selected locations that vanished from the data.
  [...state.locs].forEach(l => { if (!LOC_COUNTS[l]) state.locs.delete(l); });
  renderLocList();
  const dFrom = document.getElementById("dFrom"), dTo = document.getElementById("dTo");
  if (dataMin) { dFrom.min = dataMin; dTo.min = dataMin; }
  if (dataMax) { dFrom.max = dataMax; dTo.max = dataMax; }
  document.getElementById("dataSpan").textContent = dataMin
    ? "Reviews span " + fmtRange(dataMin, dataMax) : "";
  syncDateUI();
}

const locOrder = () => Object.keys(LOC_COUNTS).sort((a, b) => LOC_COUNTS[b] - LOC_COUNTS[a] || a.localeCompare(b));

function renderLocList() {
  const locs = locOrder();
  const all = state.locs.size === 0;
  document.getElementById("locList").innerHTML =
    `<button class="prow ${all ? "on" : ""}" data-loc="*"><span class="ck"></span>All locations<span class="cnt">${fmt(VIS.length)}</span></button>` +
    locs.map(l => `<button class="prow ${state.locs.has(l) ? "on" : ""}" data-loc="${esc(l)}"><span class="ck"></span>${esc(l)}<span class="cnt">${fmt(LOC_COUNTS[l])}</span></button>`).join("");
  const sel = locs.filter(l => state.locs.has(l));
  const val = document.getElementById("locVal"), n = document.getElementById("locN");
  val.textContent = all ? "All" : (sel.length <= 3 ? sel.join(", ") : sel.length + " locations");
  n.textContent = sel.length; n.classList.toggle("show", !all && sel.length > 3);
  document.getElementById("locBtn").classList.toggle("active", !all);
  document.getElementById("locClear").textContent = all ? "" : "Select all";
}

function toggleLoc(l) {
  if (l === "*") state.locs.clear();
  else {
    if (state.locs.has(l)) state.locs.delete(l); else state.locs.add(l);
    if (state.locs.size === Object.keys(LOC_COUNTS).length) state.locs.clear(); // every box ticked = all
  }
  renderLocList();
  render();
}

/* ---------- aggregation for current filters ---------- */

function srcCounts(entry) {
  if (state.src === "e") return entry.e.slice();
  if (state.src === "p") return entry.p.slice();
  return [entry.e[0] + entry.p[0], entry.e[1] + entry.p[1], entry.e[2] + entry.p[2]];
}

function recompute() {
  // Pass 1: per-agent, per-location counts (date filter only).
  const perAgent = {}; // agent -> loc -> {e, p, n}
  for (const [s, b, agent, loc, d] of VIS) {
    if (!inRange(d)) continue;
    if (!perAgent[agent]) perAgent[agent] = {};
    if (!perAgent[agent][loc]) perAgent[agent][loc] = { e: [0, 0, 0], p: [0, 0, 0], n: 0 };
    const entry = perAgent[agent][loc];
    entry[s ? "p" : "e"][b]++;
    entry.n++;
  }
  // Pass 2: home each agent at the location holding most of their reviews,
  // summing their reviews from every location there. Unassigned reviews are
  // no one's, so they stay at their own location.
  DATA = {};
  const add = (loc, agent, entry) => {
    if (!DATA[loc]) DATA[loc] = {};
    DATA[loc][agent] = { e: entry.e, p: entry.p };
  };
  for (const agent of Object.keys(perAgent)) {
    const locs = Object.keys(perAgent[agent]);
    if (agent === UNASSIGNED) {
      locs.forEach(loc => add(loc, agent, perAgent[agent][loc]));
      continue;
    }
    const home = locs.sort((a, b) =>
      perAgent[agent][b].n - perAgent[agent][a].n || a.localeCompare(b))[0];
    const sum = { e: [0, 0, 0], p: [0, 0, 0] };
    for (const loc of locs)
      for (const k of ["e", "p"])
        for (let i = 0; i < 3; i++) sum[k][i] += perAgent[agent][loc][k][i];
    add(home, agent, sum);
  }
  // The location filter selects homed groups, so a filtered view still shows
  // each agent's full summed counts.
  if (state.locs.size) {
    const keep = {};
    for (const loc of state.locs) if (DATA[loc]) keep[loc] = DATA[loc];
    DATA = keep;
  }
}

function agentsFor(locData) {
  const q = state.q.trim().toUpperCase();
  return Object.keys(locData)
    .filter(n => state.unassigned || n !== UNASSIGNED)
    .map(n => { const c = srcCounts(locData[n]); return { name: n, c, total: c[0] + c[1] + c[2] }; })
    .filter(a => a.total > 0)
    .filter(a => !q || a.name.toUpperCase().includes(q))
    .sort((a, b) => {
      switch (state.sort) {
        case "net": return (b.c[0] - b.c[2]) - (a.c[0] - a.c[2]) || b.total - a.total;
        case "neg": return b.c[2] - a.c[2] || b.total - a.total;
        case "pos": return b.c[0] - a.c[0] || b.total - a.total;
        case "pctpos": return pct(b.c[0], b.total) - pct(a.c[0], a.total) || b.total - a.total;
        case "pctneg": return pct(b.c[2], b.total) - pct(a.c[2], a.total) || b.total - a.total;
        case "name": return a.name.localeCompare(b.name);
        default: return b.total - a.total;
      }
    });
}

// One group per location (largest first), each with its own agent list.
function currentGroups() {
  return Object.keys(DATA).map(loc => {
    const agents = agentsFor(DATA[loc]);
    const t = [0, 0, 0];
    agents.forEach(a => { t[0] += a.c[0]; t[1] += a.c[1]; t[2] += a.c[2]; });
    return { loc, agents, t, total: t[0] + t[1] + t[2] };
  }).filter(g => g.agents.length > 0)
    .sort((a, b) => b.total - a.total);
}

const srcLabel = { both: "Expedia + Priceline", e: "Expedia", p: "Priceline" };
const locsLabel = () => {
  const sel = locOrder().filter(l => state.locs.has(l));
  return sel.length <= 3 ? sel.join(", ") : sel.length + " locations";
};
function scopeLabel(withDates = false) {
  let s = srcLabel[state.src];
  if (state.locs.size) s += " · " + locsLabel();
  if (withDates && state.preset !== "all") s += " · " + dateLabel();
  if (state.dups === "show" && DUP_N) s += " · incl. duplicates";
  return s;
}
const singleLoc = () => state.locs.size === 1;

/* ---------- rendering ---------- */

function segsHtml(counts, loc, agent) {
  return [["pos", 0], ["neu", 1], ["neg", 2]]
    .filter(([, i]) => counts[i] > 0)
    .map(([cls, i]) =>
      `<div class="segp" style="flex:${counts[i]} 0 0" data-loc="${esc(loc)}" data-key="${esc(agent)}">
         <div class="seg-fill ${cls}-fill" style="background:var(--${cls})" data-count="${counts[i]}"></div>
       </div>`).join("");
}

function labelSegs(container) {
  requestAnimationFrame(() => {
    container.querySelectorAll(".seg-fill").forEach(s => {
      s.textContent = s.dataset.count && s.offsetWidth >= 30 ? fmt(+s.dataset.count) : "";
    });
  });
}

function renderTiles(groups) {
  const t = [0, 0, 0];
  groups.forEach(g => { t[0] += g.t[0]; t[1] += g.t[1]; t[2] += g.t[2]; });
  const total = t[0] + t[1] + t[2];
  const scope = scopeLabel(true);
  const tile = (label, val, sub, dot) => `
    <div class="tile">
      <div class="k">${dot ? `<span class="dot" style="background:${dot}"></span>` : ""}${label}</div>
      <div class="v">${fmt(val)}</div>
      <div class="s">${esc(sub)}</div>
    </div>`;
  const net = t[0] - t[2];
  document.getElementById("tiles").innerHTML =
    tile("Total reviews", total, scope) +
    tile("Positive · 4–5★", t[0], pct(t[0], total) + "% of total", "var(--pos)") +
    tile("Neutral · 3★", t[1], pct(t[1], total) + "% of total", "var(--neu)") +
    tile("Negative · 1–2★", t[2], pct(t[2], total) + "% of total", "var(--neg)") +
    `<div class="tile">
      <div class="k">Net · pos − neg</div>
      <div class="v net ${netCls(net)}" style="font-size:28px">${fmtNet(net)}</div>
      <div class="s">${fmt(t[0])} positive − ${fmt(t[2])} negative</div>
    </div>`;
}

function renderChart(groups) {
  const el = document.getElementById("chart");
  const all = groups.flatMap(g => g.agents);
  if (!all.length) { el.innerHTML = `<div class="empty">No reviews match these filters.</div>`; return; }
  const max = Math.max(...all.map(a => a.total)); // one scale across all locations
  const showHead = !singleLoc();
  el.innerHTML = groups.map(g => {
    const head = showHead
      ? `<div class="grp-head"><span class="grp-name">${esc(g.loc)}</span><span class="grp-sum">${fmt(g.total)} reviews · ${pct(g.t[0], g.total)}% positive · ${pct(g.t[2], g.total)}% negative · net <b class="net ${netCls(g.t[0] - g.t[2])}">${fmtNet(g.t[0] - g.t[2])}</b></span></div>`
      : "";
    return head + g.agents.map(a => {
      const net = a.c[0] - a.c[2];
      const w = state.mode === "share" ? 100 : (a.total / max * 100);
      const bar = `<div style="display:flex;width:${w}%">${segsHtml(a.c, g.loc, a.name)}</div>`;
      return `<div class="row">
        <div class="name ${a.name === UNASSIGNED ? "unassigned" : ""}" title="${esc(a.name)}">${esc(a.name)}</div>
        <div class="bar">${bar}</div>
        <div class="total">${fmt(a.total)}</div>
        <div class="net ${netCls(net)}" title="positive − negative">${fmtNet(net)}</div>
      </div>`;
    }).join("");
  }).join("");
  labelSegs(el);
}

function renderTable(groups) {
  const both = state.src === "both";
  const cols = both ? 13 : 8;
  const head = both
    ? `<tr><th>Agent</th><th>Exp +</th><th>Exp ○</th><th>Exp −</th><th>Pcl +</th><th>Pcl ○</th><th>Pcl −</th><th>Positive</th><th>Neutral</th><th>Negative</th><th>Net</th><th>Total</th><th>% Neg</th></tr>`
    : `<tr><th>Agent</th><th>Positive</th><th>Neutral</th><th>Negative</th><th>Net</th><th>Total</th><th>% Pos</th><th>% Neg</th></tr>`;
  const showHead = !singleLoc();
  const rows = groups.map(g => {
    const grpRow = showHead
      ? `<tr class="grp"><td colspan="${cols}">${esc(g.loc)} — ${fmt(g.total)} reviews · ${pct(g.t[0], g.total)}% positive · ${pct(g.t[2], g.total)}% negative</td></tr>`
      : "";
    return grpRow + g.agents.map(a => {
      const d = DATA[g.loc][a.name];
      const netCell = `<td class="net ${netCls(a.c[0] - a.c[2])}">${fmtNet(a.c[0] - a.c[2])}</td>`;
      if (both) {
        return `<tr><td>${esc(a.name)}</td><td>${d.e[0]}</td><td>${d.e[1]}</td><td>${d.e[2]}</td><td>${d.p[0]}</td><td>${d.p[1]}</td><td>${d.p[2]}</td><td class="posc">${a.c[0]}</td><td>${a.c[1]}</td><td class="negc">${a.c[2]}</td>${netCell}<td>${fmt(a.total)}</td><td>${pct(a.c[2], a.total)}%</td></tr>`;
      }
      return `<tr><td>${esc(a.name)}</td><td class="posc">${a.c[0]}</td><td>${a.c[1]}</td><td class="negc">${a.c[2]}</td>${netCell}<td>${fmt(a.total)}</td><td>${pct(a.c[0], a.total)}%</td><td>${pct(a.c[2], a.total)}%</td></tr>`;
    }).join("");
  }).join("");
  document.getElementById("tableView").innerHTML =
    `<table class="data"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

function render() {
  if (!ROWS) return;
  recompute();
  const groups = currentGroups();
  renderTiles(groups);
  document.getElementById("cardTitle").textContent = `Reviews by agent — ${scopeLabel(true)}`;
  const uniqAgents = new Set(groups.flatMap(g => g.agents.map(a => a.name))).size;
  document.getElementById("cardCount").textContent = singleLoc()
    ? `${uniqAgents} agents`
    : `${uniqAgents} agents · ${groups.length} locations`;
  document.getElementById("chart").hidden = state.table;
  document.getElementById("tableView").hidden = !state.table;
  if (state.table) renderTable(groups); else renderChart(groups);

  let e = 0, p = 0;
  VIS.forEach(r => { r[0] ? p++ : e++; });
  const dupNote = DUP_N ? (state.dups === "hide" ? ` (${fmt(DUP_N)} duplicates hidden)` : ` (incl. ${fmt(DUP_N)} duplicates)`) : "";
  document.getElementById("subline").textContent =
    `${fmt(e)} Expedia and ${fmt(p)} Priceline reviews${dupNote}, grouped by check-out agent, location, date and star sentiment. `;
  document.getElementById("stampText").textContent = lastFetched
    ? "Live · updated " + lastFetched.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
    : "Snapshot · " + SNAPSHOT_DATE;

  let unTotal = 0;
  Object.values(DATA).forEach(locData => {
    if (locData[UNASSIGNED]) { const c = srcCounts(locData[UNASSIGNED]); unTotal += c[0] + c[1] + c[2]; }
  });
  const homingNote = " Agents with reviews at several locations are listed once, under the location with most of their reviews.";
  const dupsNote = !DUP_N ? "" : state.dups === "hide"
    ? ` ${fmt(DUP_N)} reviews marked “Duplicate? = Yes” in the sheet are hidden — switch Duplicates to “Show” to count them too.`
    : ` Counts include ${fmt(DUP_N)} reviews marked “Duplicate? = Yes” in the sheet — switch Duplicates to “Hide” to count each review once.`;
  document.getElementById("footnote").textContent = (state.unassigned
    ? `“(Unassigned)” groups reviews with no Agent Out recorded (${fmt(unTotal)} in this view). Positive = 4–5 stars, Neutral = 3, Negative = 1–2.`
    : `${fmt(unTotal)} reviews in this view have no Agent Out recorded — tick “Include unassigned” to see them. Positive = 4–5 stars, Neutral = 3, Negative = 1–2.`) + homingNote + dupsNote;
}

/* ---------- controls ---------- */

document.getElementById("srcSeg").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  state.src = b.dataset.src;
  document.querySelectorAll("#srcSeg button").forEach(x => x.classList.toggle("on", x === b));
  render();
});
function syncDupUI() {
  document.querySelectorAll("#dupSeg button").forEach(x => x.classList.toggle("on", x.dataset.dup === state.dups));
}
document.getElementById("dupSeg").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  state.dups = b.dataset.dup;
  try { localStorage.setItem(DUPS_KEY, state.dups); } catch (_) {}
  syncDupUI();
  if (ROWS) populateFilters(); // location counts and the date span depend on the switch
  render();
});
document.getElementById("modeSeg").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  state.mode = b.dataset.mode;
  document.querySelectorAll("#modeSeg button").forEach(x => x.classList.toggle("on", x === b));
  render();
});
document.getElementById("sortSel").addEventListener("change", ev => { state.sort = ev.target.value; render(); });
document.getElementById("search").addEventListener("input", ev => { state.q = ev.target.value; render(); });
document.getElementById("unassigned").addEventListener("change", ev => { state.unassigned = ev.target.checked; render(); });
document.getElementById("viewToggle").addEventListener("click", ev => {
  state.table = !state.table;
  ev.target.textContent = state.table ? "Chart view" : "Table view";
  render();
});
document.getElementById("refreshBtn").addEventListener("click", () => loadData());

// Popovers: one open at a time; close on outside click or Escape.
function setOpen(id, open) {
  const dd = document.getElementById(id);
  const btn = dd.querySelector(".ddbtn"), pop = dd.querySelector(".pop");
  pop.hidden = !open;
  btn.setAttribute("aria-expanded", String(open));
  if (open) {
    // Keep the popover on screen if the button sits near the right edge.
    const r = btn.getBoundingClientRect();
    pop.classList.toggle("right", r.left + pop.offsetWidth > innerWidth - 16);
  }
}
const isOpen = id => !document.getElementById(id).querySelector(".pop").hidden;
document.getElementById("dateBtn").addEventListener("click", () => { setOpen("locDD", false); setOpen("dateDD", !isOpen("dateDD")); });
document.getElementById("locBtn").addEventListener("click", () => { setOpen("dateDD", false); setOpen("locDD", !isOpen("locDD")); });
document.addEventListener("click", ev => {
  if (!ev.target.closest("#dateDD")) setOpen("dateDD", false);
  if (!ev.target.closest("#locDD")) setOpen("locDD", false);
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") { setOpen("dateDD", false); setOpen("locDD", false); } });

document.getElementById("datePresets").addEventListener("click", ev => {
  const b = ev.target.closest(".prow"); if (!b) return;
  applyPreset(b.dataset.preset);
});
document.getElementById("dFrom").addEventListener("change", applyCustom);
document.getElementById("dTo").addEventListener("change", applyCustom);
document.getElementById("dClear").addEventListener("click", () => applyPreset("all"));
document.getElementById("locList").addEventListener("click", ev => {
  const b = ev.target.closest(".prow"); if (!b) return;
  toggleLoc(b.dataset.loc);
});
document.getElementById("locClear").addEventListener("click", () => toggleLoc("*"));

/* ---------- tooltip ---------- */

const tip = document.getElementById("tooltip");
const SEGMENTS = [
  ["Positive 4–5★", "var(--pos)"],
  ["Neutral 3★", "var(--neu)"],
  ["Negative 1–2★", "var(--neg)"],
];
function showTip(ev, name, scope, entry) {
  const c = srcCounts(entry);
  const total = c[0] + c[1] + c[2];
  const rowsHtml = SEGMENTS.map(([label, color], i) => `
    <tr><td><span class="sw" style="background:${color}"></span>${label}</td>
    <td class="num">${fmt(c[i])}</td><td class="num">${pct(c[i], total)}%</td></tr>`).join("");
  const split = state.src === "both"
    ? `<tr><td colspan="3" style="padding-top:6px;color:var(--muted)">Expedia ${entry.e[0]}+ / ${entry.e[1]}○ / ${entry.e[2]}− · Priceline ${entry.p[0]}+ / ${entry.p[1]}○ / ${entry.p[2]}−</td></tr>`
    : "";
  const net = c[0] - c[2];
  const netRow = `<tr><td>Net (pos − neg)</td><td class="num net ${netCls(net)}" colspan="2">${fmtNet(net)}</td></tr>`;
  tip.innerHTML = `<div class="tt-name">${esc(name)}</div>
    <div class="tt-scope">${esc(scope)} · ${fmt(total)} reviews</div>
    <table>${rowsHtml}${netRow}${split}</table>`;
  tip.style.display = "block";
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 8) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function tipHandler(ev) {
  const segp = ev.target.closest(".segp");
  if (!segp) { tip.style.display = "none"; return; }
  const { loc, key } = segp.dataset;
  const entry = DATA[loc] && DATA[loc][key];
  if (entry) {
    let scope = srcLabel[state.src] + " · " + loc;
    if (state.preset !== "all") scope += " · " + dateLabel();
    showTip(ev, key, scope, entry);
  }
}
const chartEl = document.getElementById("chart");
chartEl.addEventListener("mousemove", tipHandler);
chartEl.addEventListener("mouseleave", () => { tip.style.display = "none"; });

/* ---------- go ---------- */

buildDatePresets();
syncDateUI();
syncDupUI();
loadData();
setInterval(loadData, REFRESH_MS);
</script>
</body>
</html>
