<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priceline & Expedia Dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --ring: rgba(11,11,11,0.10);
  --pos: #2a78d6;
  --neu: #a8a6a0;
  --neg: #e34948;
  --accent: #2a78d6;
  --wash: rgba(42,120,214,0.08);
  --delta-good: #006300;
  --delta-bad: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --ring: rgba(255,255,255,0.10);
    --pos: #3987e5;
    --neu: #8b8983;
    --neg: #e66767;
    --accent: #3987e5;
    --wash: rgba(57,135,229,0.14);
    --delta-good: #0ca30c;
    --delta-bad: #e66767;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1060px; margin: 0 auto; padding: 32px 20px 64px; }
header { margin-bottom: 24px; }
.eyebrow {
  font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; margin-bottom: 6px;
}
h1 { font-size: 26px; font-weight: 700; margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 14px; margin: 0; }
.stamp { display: inline-flex; align-items: center; gap: 6px; }
.stamp .pulse {
  width: 8px; height: 8px; border-radius: 50%; background: #0ca30c; flex: none;
  animation: pulse 2.4s ease-in-out infinite;
}
.stamp.stale .pulse { background: #fab219; animation: none; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .stamp .pulse { animation: none; } }

.banner {
  background: var(--surface); border: 1px solid #fab219; border-radius: 8px;
  padding: 10px 14px; font-size: 13.5px; color: var(--ink-2); margin: 14px 0 0;
  display: none;
}
.banner.show { display: block; }

.controls {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  margin: 20px 0 16px;
}
.seg {
  display: inline-flex; background: var(--surface); border: 1px solid var(--ring);
  border-radius: 8px; padding: 3px; gap: 2px;
}
.seg button {
  border: 0; background: transparent; color: var(--ink-2); font: inherit;
  font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 6px;
  cursor: pointer;
}
.seg button:hover { background: var(--wash); }
.seg button.on { background: var(--accent); color: #fff; }
.seg button:focus-visible, select:focus-visible, input:focus-visible, .toggle:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
select, input[type="search"] {
  background: var(--surface); color: var(--ink); border: 1px solid var(--ring);
  border-radius: 8px; font: inherit; font-size: 13px; padding: 7px 10px;
}
input[type="search"] { width: 170px; }
label.chk {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
  color: var(--ink-2); cursor: pointer; user-select: none;
}
label.chk input { accent-color: var(--accent); }
.toggle {
  background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--ring); border-radius: 8px; font: inherit;
  font-size: 13px; font-weight: 600; padding: 7px 12px; cursor: pointer;
}
.toggle:hover { background: var(--wash); }
.spacer { margin-left: auto; display: flex; gap: 8px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile {
  background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
  padding: 14px 16px;
}
.tile .k {
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px;
}
.tile .k .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.tile .v { font-size: 26px; font-weight: 700; margin-top: 2px; }
.tile .s { font-size: 12.5px; color: var(--ink-2); }

.card {
  background: var(--surface); border: 1px solid var(--ring); border-radius: 12px;
  padding: 18px 20px;
}
.card + .card { margin-top: 16px; }
.card-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline; margin-bottom: 14px; }
.card-head h2 { font-size: 15px; font-weight: 700; margin: 0; }
.card-head .n { color: var(--muted); font-size: 13px; }
.legend { display: flex; gap: 14px; margin-left: auto; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }

.rows { display: flex; flex-direction: column; }
.grp-head {
  display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline;
  margin: 16px 6px 6px; padding-top: 12px; border-top: 1px solid var(--grid);
}
.grp-head:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.grp-name { font-size: 13.5px; font-weight: 700; letter-spacing: 0.04em; }
.grp-sum { font-size: 12.5px; color: var(--muted); }
table.data tr.grp td {
  color: var(--ink); font-weight: 700; text-align: left;
  padding-top: 16px; border-bottom: 1px solid var(--baseline);
}
.row {
  display: grid; grid-template-columns: 200px 1fr 52px 56px; gap: 12px;
  align-items: center; padding: 5px 6px; border-radius: 8px;
}
.row:hover { background: var(--wash); }
.row .name {
  font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; text-align: right; color: var(--ink);
}
.row .name.unassigned { color: var(--muted); font-style: italic; }
.row .total { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.net { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.net.up { color: var(--delta-good); }
.net.down { color: var(--delta-bad); }
.net.flat { color: var(--muted); }
.bar { display: flex; height: 20px; align-items: stretch; border-left: 2px solid var(--baseline); padding-left: 1px; }
.segp { display: flex; min-width: 0; }
.seg-fill {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 600; color: #fff; overflow: hidden;
  white-space: nowrap;
}
.segp + .segp { margin-left: 2px; }
.segp:last-child .seg-fill { border-radius: 0 4px 4px 0; }
.seg-fill.neu-fill { color: var(--ink); }
@media (prefers-color-scheme: dark) { .seg-fill.neu-fill { color: #0b0b0b; } }
.empty { color: var(--muted); font-size: 13px; padding: 12px 6px; }

#tooltip {
  position: fixed; pointer-events: none; z-index: 10; display: none;
  background: var(--surface); border: 1px solid var(--ring); border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.18); padding: 10px 12px; font-size: 12.5px;
  min-width: 200px;
}
#tooltip .tt-name { font-weight: 700; margin-bottom: 2px; }
#tooltip .tt-scope { color: var(--muted); font-size: 11.5px; margin-bottom: 6px; }
#tooltip table { border-collapse: collapse; width: 100%; }
#tooltip td { padding: 1.5px 0; color: var(--ink-2); }
#tooltip td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); padding-left: 12px; }
#tooltip .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: baseline; }

.tablewrap { overflow-x: auto; }
table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
table.data th, table.data td { padding: 7px 10px; text-align: right; font-variant-numeric: tabular-nums; }
table.data th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--baseline); white-space: nowrap; }
table.data td { border-bottom: 1px solid var(--grid); color: var(--ink-2); }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data td:first-child { color: var(--ink); font-weight: 600; }
table.data td.posc { color: var(--pos); font-weight: 600; }
table.data td.negc { color: var(--neg); font-weight: 600; }
.foot { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
@media (max-width: 640px) {
  .row { grid-template-columns: 110px 1fr 40px 48px; }
  .spacer { margin-left: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Drivo · Priceline &amp; Expedia</div>
    <h1>Priceline &amp; Expedia Dashboard</h1>
    <p class="sub"><span id="subline">Loading the latest reviews from Google Sheets…</span>
      <span class="stamp" id="stamp" hidden><span class="pulse"></span><span id="stampText"></span></span>
    </p>
    <div class="banner" id="banner"></div>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Source" id="srcSeg">
      <button data-src="both" class="on">Both</button>
      <button data-src="e">Expedia</button>
      <button data-src="p">Priceline</button>
    </div>
    <select id="locSel" aria-label="Location"><option value="all">All locations</option></select>
    <select id="monthSel" aria-label="Month"><option value="all">All months</option></select>
    <div class="seg" role="group" aria-label="Bar mode" id="modeSeg">
      <button data-mode="count" class="on">Counts</button>
      <button data-mode="share">Share %</button>
    </div>
    <select id="sortSel" aria-label="Sort agents">
      <option value="total">Most reviews</option>
      <option value="net">Best net (pos − neg)</option>
      <option value="neg">Most negative</option>
      <option value="pos">Most positive</option>
      <option value="pctpos">Highest % positive</option>
      <option value="pctneg">Highest % negative</option>
      <option value="name">Name A–Z</option>
    </select>
    <input type="search" id="search" placeholder="Find an agent…" aria-label="Find an agent">
    <label class="chk"><input type="checkbox" id="unassigned"> Include unassigned</label>
    <div class="spacer">
      <button class="toggle" id="refreshBtn" title="Re-pull the sheet now">↻ Refresh</button>
      <button class="toggle" id="viewToggle">Table view</button>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="card">
    <div class="card-head">
      <h2 id="cardTitle">Reviews by agent</h2>
      <span class="n" id="cardCount"></span>
      <div class="legend">
        <span><i style="background:var(--pos)"></i>Positive 4–5★</span>
        <span><i style="background:var(--neu)"></i>Neutral 3★</span>
        <span><i style="background:var(--neg)"></i>Negative 1–2★</span>
      </div>
    </div>
    <div class="rows" id="chart"><div class="empty">Loading…</div></div>
    <div class="tablewrap" id="tableView" hidden></div>
    <p class="foot" id="footnote"></p>
  </div>
</div>

<div id="tooltip" role="tooltip"></div>

let ROWS = null;        // raw compact rows
let DATA = {};          // location -> agent -> {e:[p,n,g], p:[p,n,g]} for current filters
let lastFetched = null;
const state = { src: "both", loc: "all", month: "all", mode: "count", sort: "total", q: "", unassigned: false, table: false };

const fmt = n => n.toLocaleString("en-US");
const pct = (n, t) => t ? Math.round(n / t * 100) : 0;
const fmtNet = n => (n > 0 ? "+" : "") + fmt(n);
const netCls = n => n > 0 ? "up" : (n < 0 ? "down" : "flat");
const monthLabel = k => {
  if (k === "0000-00") return "Unknown";
  const [y, m] = k.split("-");
  return MONTH_ABBR[+m - 1] + " " + y;
};

async function loadData() {
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true; btn.textContent = "↻ Refreshing…";
  try {
    const res = await fetch(DATA_URL + "?_cb=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    if (!json.rows || !json.rows.length) throw new Error("empty dataset");
    ROWS = json.rows;
    lastFetched = new Date(json.fetchedAt || Date.now());
    document.getElementById("banner").classList.remove("show");
    document.getElementById("stamp").hidden = false;
    document.getElementById("stamp").classList.remove("stale");
  } catch (err) {
    if (!ROWS) {
      ROWS = FALLBACK.filter(r => r[3] && !/^unknown$/i.test(r[3]));
      document.getElementById("stamp").hidden = false;
      document.getElementById("stamp").classList.add("stale");
    }
    const b = document.getElementById("banner");
    b.textContent = location.protocol === "file:"
      ? "Live data is unavailable because this page was opened as a local file — Google Sheets only " +
        "allows live reads from a hosted web address (https). Upload this file to a web host " +
        "(e.g. drag it onto app.netlify.com/drop) and open that link instead. Showing " +
        (lastFetched ? "the last loaded data." : "a saved snapshot from Sep 4, 2026.")
      : "Couldn't reach Google Sheets (" + err.message +
        "). Showing " + (lastFetched ? "the last loaded data." : "a saved snapshot from Sep 4, 2026.") +
        " It will retry automatically.";
    b.classList.add("show");
  }
  populateFilters();
  btn.disabled = false; btn.textContent = "↻ Refresh";
  render();
}

/* ---------- filters ---------- */

function populateFilters() {
  const locCount = {}, monthSet = new Set();
  ROWS.forEach(r => { locCount[r[3]] = (locCount[r[3]] || 0) + 1; monthSet.add(r[4]); });
  const locSel = document.getElementById("locSel");
  const monthSel = document.getElementById("monthSel");
  const locs = Object.keys(locCount).sort((a, b) => locCount[b] - locCount[a]);
  const months = [...monthSet].sort().reverse(); // newest first in the dropdown
  locSel.innerHTML = `<option value="all">All locations</option>` +
    locs.map(l => `<option value="${l}">${l}</option>`).join("");
  monthSel.innerHTML = `<option value="all">All months</option>` +
    months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join("");
  if (![...locSel.options].some(o => o.value === state.loc)) state.loc = "all";
  if (![...monthSel.options].some(o => o.value === state.month)) state.month = "all";
  locSel.value = state.loc;
  monthSel.value = state.month;
}

/* ---------- aggregation for current filters ---------- */

function srcCounts(entry) {
  if (state.src === "e") return entry.e.slice();
  if (state.src === "p") return entry.p.slice();
  return [entry.e[0] + entry.p[0], entry.e[1] + entry.p[1], entry.e[2] + entry.p[2]];
}

function recompute() {
  // Pass 1: per-agent, per-location counts (month filter only).
  const perAgent = {}; // agent -> loc -> {e, p, n}
  for (const [s, b, agent, loc, m] of ROWS) {
    if (state.month !== "all" && m !== state.month) continue;
    if (!perAgent[agent]) perAgent[agent] = {};
    if (!perAgent[agent][loc]) perAgent[agent][loc] = { e: [0, 0, 0], p: [0, 0, 0], n: 0 };
    const entry = perAgent[agent][loc];
    entry[s ? "p" : "e"][b]++;
    entry.n++;
  }
  // Pass 2: home each agent at the location holding most of their reviews,
  // summing their reviews from every location there. Unassigned reviews are
  // no one's, so they stay at their own location.
  DATA = {};
  const add = (loc, agent, entry) => {
    if (!DATA[loc]) DATA[loc] = {};
    DATA[loc][agent] = { e: entry.e, p: entry.p };
  };
  for (const agent of Object.keys(perAgent)) {
    const locs = Object.keys(perAgent[agent]);
    if (agent === UNASSIGNED) {
      locs.forEach(loc => add(loc, agent, perAgent[agent][loc]));
      continue;
    }
    const home = locs.sort((a, b) =>
      perAgent[agent][b].n - perAgent[agent][a].n || a.localeCompare(b))[0];
    const sum = { e: [0, 0, 0], p: [0, 0, 0] };
    for (const loc of locs)
      for (const k of ["e", "p"])
        for (let i = 0; i < 3; i++) sum[k][i] += perAgent[agent][loc][k][i];
    add(home, agent, sum);
  }
  // The location filter selects homed groups, so a filtered view still shows
  // each agent's full summed counts.
  if (state.loc !== "all") DATA = DATA[state.loc] ? { [state.loc]: DATA[state.loc] } : {};
}

function agentsFor(locData) {
  const q = state.q.trim().toUpperCase();
  return Object.keys(locData)
    .filter(n => state.unassigned || n !== UNASSIGNED)
    .map(n => { const c = srcCounts(locData[n]); return { name: n, c, total: c[0] + c[1] + c[2] }; })
    .filter(a => a.total > 0)
    .filter(a => !q || a.name.toUpperCase().includes(q))
    .sort((a, b) => {
      switch (state.sort) {
        case "net": return (b.c[0] - b.c[2]) - (a.c[0] - a.c[2]) || b.total - a.total;
        case "neg": return b.c[2] - a.c[2] || b.total - a.total;
        case "pos": return b.c[0] - a.c[0] || b.total - a.total;
        case "pctpos": return pct(b.c[0], b.total) - pct(a.c[0], a.total) || b.total - a.total;
        case "pctneg": return pct(b.c[2], b.total) - pct(a.c[2], a.total) || b.total - a.total;
        case "name": return a.name.localeCompare(b.name);
        default: return b.total - a.total;
      }
    });
}

// One group per location (largest first), each with its own agent list.
function currentGroups() {
  return Object.keys(DATA).map(loc => {
    const agents = agentsFor(DATA[loc]);
    const t = [0, 0, 0];
    agents.forEach(a => { t[0] += a.c[0]; t[1] += a.c[1]; t[2] += a.c[2]; });
    return { loc, agents, t, total: t[0] + t[1] + t[2] };
  }).filter(g => g.agents.length > 0)
    .sort((a, b) => b.total - a.total);
}

const srcLabel = { both: "Expedia + Priceline", e: "Expedia", p: "Priceline" };
function scopeLabel() {
  let s = srcLabel[state.src];
  if (state.loc !== "all") s += " · " + state.loc;
  return s;
}

/* ---------- rendering ---------- */

function segsHtml(counts, loc, agent) {
  return [["pos", 0], ["neu", 1], ["neg", 2]]
    .filter(([, i]) => counts[i] > 0)
    .map(([cls, i]) =>
      `<div class="segp" style="flex:${counts[i]} 0 0" data-loc="${loc}" data-key="${agent}">
         <div class="seg-fill ${cls === "neu" ? "neu-fill" : ""}" style="background:var(--${cls})" data-count="${counts[i]}"></div>
       </div>`).join("");
}

function labelSegs(container) {
  requestAnimationFrame(() => {
    container.querySelectorAll(".seg-fill").forEach(s => {
      s.textContent = s.offsetWidth >= 30 ? fmt(+s.dataset.count) : "";
    });
  });
}

function renderTiles(groups) {
  const t = [0, 0, 0];
  groups.forEach(g => { t[0] += g.t[0]; t[1] += g.t[1]; t[2] += g.t[2]; });
  const total = t[0] + t[1] + t[2];
  const scope = scopeLabel() + (state.month !== "all" ? " · " + monthLabel(state.month) : "");
  const tile = (label, val, sub, dot) => `
    <div class="tile">
      <div class="k">${dot ? `<span class="dot" style="background:${dot}"></span>` : ""}${label}</div>
      <div class="v">${fmt(val)}</div>
      <div class="s">${sub}</div>
    </div>`;
  const net = t[0] - t[2];
  document.getElementById("tiles").innerHTML =
    tile("Total reviews", total, scope) +
    tile("Positive · 4–5★", t[0], pct(t[0], total) + "% of total", "var(--pos)") +
    tile("Neutral · 3★", t[1], pct(t[1], total) + "% of total", "var(--neu)") +
    tile("Negative · 1–2★", t[2], pct(t[2], total) + "% of total", "var(--neg)") +
    `<div class="tile">
      <div class="k">Net · pos − neg</div>
      <div class="v net ${netCls(net)}" style="font-size:26px">${fmtNet(net)}</div>
      <div class="s">${fmt(t[0])} positive − ${fmt(t[2])} negative</div>
    </div>`;
}

function renderChart(groups) {
  const el = document.getElementById("chart");
  const all = groups.flatMap(g => g.agents);
  if (!all.length) { el.innerHTML = `<div class="empty">No agents match this filter.</div>`; return; }
  const max = Math.max(...all.map(a => a.total)); // one scale across all locations
  const showHead = state.loc === "all";
  el.innerHTML = groups.map(g => {
    const head = showHead
      ? `<div class="grp-head"><span class="grp-name">${g.loc}</span><span class="grp-sum">${fmt(g.total)} reviews · ${pct(g.t[0], g.total)}% positive · ${pct(g.t[2], g.total)}% negative · net <b class="net ${netCls(g.t[0] - g.t[2])}">${fmtNet(g.t[0] - g.t[2])}</b></span></div>`
      : "";
    return head + g.agents.map(a => {
      const w = state.mode === "share" ? 100 : (a.total / max * 100);
      const net = a.c[0] - a.c[2];
      return `<div class="row">
        <div class="name ${a.name === UNASSIGNED ? "unassigned" : ""}" title="${a.name}">${a.name}</div>
        <div class="bar"><div style="display:flex;width:${w}%">${segsHtml(a.c, g.loc, a.name)}</div></div>
        <div class="total">${fmt(a.total)}</div>
        <div class="net ${netCls(net)}" title="positive − negative">${fmtNet(net)}</div>
      </div>`;
    }).join("");
  }).join("");
  labelSegs(el);
}

function renderTable(groups) {
  const both = state.src === "both";
  const cols = both ? 13 : 8;
  const head = both
    ? `<tr><th>Agent</th><th>Exp +</th><th>Exp ○</th><th>Exp −</th><th>Pcl +</th><th>Pcl ○</th><th>Pcl −</th><th>Positive</th><th>Neutral</th><th>Negative</th><th>Net</th><th>Total</th><th>% Neg</th></tr>`
    : `<tr><th>Agent</th><th>Positive</th><th>Neutral</th><th>Negative</th><th>Net</th><th>Total</th><th>% Pos</th><th>% Neg</th></tr>`;
  const showHead = state.loc === "all";
  const rows = groups.map(g => {
    const grpRow = showHead
      ? `<tr class="grp"><td colspan="${cols}">${g.loc} — ${fmt(g.total)} reviews · ${pct(g.t[0], g.total)}% positive · ${pct(g.t[2], g.total)}% negative</td></tr>`
      : "";
    return grpRow + g.agents.map(a => {
      const d = DATA[g.loc][a.name];
      const netCell = `<td class="net ${netCls(a.c[0] - a.c[2])}">${fmtNet(a.c[0] - a.c[2])}</td>`;
      if (both) {
        return `<tr><td>${a.name}</td><td>${d.e[0]}</td><td>${d.e[1]}</td><td>${d.e[2]}</td><td>${d.p[0]}</td><td>${d.p[1]}</td><td>${d.p[2]}</td><td class="posc">${a.c[0]}</td><td>${a.c[1]}</td><td class="negc">${a.c[2]}</td>${netCell}<td>${fmt(a.total)}</td><td>${pct(a.c[2], a.total)}%</td></tr>`;
      }
      return `<tr><td>${a.name}</td><td class="posc">${a.c[0]}</td><td>${a.c[1]}</td><td class="negc">${a.c[2]}</td>${netCell}<td>${fmt(a.total)}</td><td>${pct(a.c[0], a.total)}%</td><td>${pct(a.c[2], a.total)}%</td></tr>`;
    }).join("");
  }).join("");
  document.getElementById("tableView").innerHTML =
    `<table class="data"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

function render() {
  if (!ROWS) return;
  recompute();
  const groups = currentGroups();
  renderTiles(groups);
  document.getElementById("cardTitle").textContent =
    `Reviews by agent — ${scopeLabel()}${state.month !== "all" ? " · " + monthLabel(state.month) : ""}`;
  const uniqAgents = new Set(groups.flatMap(g => g.agents.map(a => a.name))).size;
  document.getElementById("cardCount").textContent = state.loc === "all"
    ? `${uniqAgents} agents · ${groups.length} locations`
    : `${uniqAgents} agents`;
  document.getElementById("chart").hidden = state.table;
  document.getElementById("tableView").hidden = !state.table;
  if (state.table) renderTable(groups); else renderChart(groups);

  let e = 0, p = 0;
  ROWS.forEach(r => { r[0] ? p++ : e++; });
  document.getElementById("subline").textContent =
    `${fmt(e)} Expedia and ${fmt(p)} Priceline reviews, grouped by check-out agent, month, location and star sentiment. `;
  document.getElementById("stampText").textContent = lastFetched
    ? "Live · updated " + lastFetched.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
    : "Snapshot · Sep 4, 2026";

  let unTotal = 0;
  Object.values(DATA).forEach(locData => {
    if (locData[UNASSIGNED]) { const c = srcCounts(locData[UNASSIGNED]); unTotal += c[0] + c[1] + c[2]; }
  });
  const homingNote = " Agents with reviews at several locations are listed once, under the location with most of their reviews.";
  document.getElementById("footnote").textContent = (state.unassigned
    ? `“(Unassigned)” groups reviews with no Agent Out recorded (${fmt(unTotal)} in this view). Positive = 4–5 stars, Neutral = 3, Negative = 1–2.`
    : `${fmt(unTotal)} reviews in this view have no Agent Out recorded — tick “Include unassigned” to see them. Positive = 4–5 stars, Neutral = 3, Negative = 1–2.`) + homingNote;
}

/* ---------- controls ---------- */

document.getElementById("srcSeg").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  state.src = b.dataset.src;
  document.querySelectorAll("#srcSeg button").forEach(x => x.classList.toggle("on", x === b));
  render();
});
document.getElementById("modeSeg").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  state.mode = b.dataset.mode;
  document.querySelectorAll("#modeSeg button").forEach(x => x.classList.toggle("on", x === b));
  render();
});
document.getElementById("locSel").addEventListener("change", ev => { state.loc = ev.target.value; render(); });
document.getElementById("monthSel").addEventListener("change", ev => { state.month = ev.target.value; render(); });
document.getElementById("sortSel").addEventListener("change", ev => { state.sort = ev.target.value; render(); });
document.getElementById("search").addEventListener("input", ev => { state.q = ev.target.value; render(); });
document.getElementById("unassigned").addEventListener("change", ev => { state.unassigned = ev.target.checked; render(); });
document.getElementById("viewToggle").addEventListener("click", ev => {
  state.table = !state.table;
  ev.target.textContent = state.table ? "Chart view" : "Table view";
  render();
});
document.getElementById("refreshBtn").addEventListener("click", () => loadData());

/* ---------- tooltip ---------- */

const tip = document.getElementById("tooltip");
const SEGMENTS = [
  ["Positive 4–5★", "var(--pos)"],
  ["Neutral 3★", "var(--neu)"],
  ["Negative 1–2★", "var(--neg)"],
];
function showTip(ev, name, scope, entry) {
  const c = srcCounts(entry);
  const total = c[0] + c[1] + c[2];
  const rowsHtml = SEGMENTS.map(([label, color], i) => `
    <tr><td><span class="sw" style="background:${color}"></span>${label}</td>
    <td class="num">${fmt(c[i])}</td><td class="num">${pct(c[i], total)}%</td></tr>`).join("");
  const split = state.src === "both"
    ? `<tr><td colspan="3" style="padding-top:6px;color:var(--muted)">Expedia ${entry.e[0]}+ / ${entry.e[1]}○ / ${entry.e[2]}− · Priceline ${entry.p[0]}+ / ${entry.p[1]}○ / ${entry.p[2]}−</td></tr>`
    : "";
  const net = c[0] - c[2];
  const netRow = `<tr><td>Net (pos − neg)</td><td class="num net ${netCls(net)}" colspan="2">${fmtNet(net)}</td></tr>`;
  tip.innerHTML = `<div class="tt-name">${name}</div>
    <div class="tt-scope">${scope} · ${fmt(total)} reviews</div>
    <table>${rowsHtml}${netRow}${split}</table>`;
  tip.style.display = "block";
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 8) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function tipHandler(ev) {
  const segp = ev.target.closest(".segp");
  if (!segp) { tip.style.display = "none"; return; }
  const { loc, key } = segp.dataset;
  const entry = DATA[loc] && DATA[loc][key];
  if (entry) {
    let scope = srcLabel[state.src] + " · " + loc;
    if (state.month !== "all") scope += " · " + monthLabel(state.month);
    showTip(ev, key, scope, entry);
  }
}
const chartEl = document.getElementById("chart");
chartEl.addEventListener("mousemove", tipHandler);
chartEl.addEventListener("mouseleave", () => { tip.style.display = "none"; });

/* ---------- go ---------- */

loadData();
setInterval(loadData, REFRESH_MS);
</script>
</body>
</html>
